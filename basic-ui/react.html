<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web page with React</title>
    <link rel="stylesheet" href="./css/index.css">
    <script src="./react-lib/react.development.js"></script>
    <script src="./react-lib/react-dom.development.js"></script>
</head>

<body>
    <div id="root"></div>

    <script>
        // create random number between 1 and 100
        const randomNumber = Math.floor(Math.random() * 100) + 1;
        //create a element to display random number
        const numberElement= React.createElement('h1', null, `Random Number: ${randomNumber}`);


        //create element to display result 
        const resultElement = React.createElement('h2', {style}, 
            randomNumber % 2 === 0 ? 'The number is even' : 'The number is odd');

        // Get root element and append the created elements
        const root=ReactDOM.createRoot(document.getElementById('root'));
        //root.render([numberElement,resultElement]);

        root.render(
            React.createElement('div', {id:"childDiv"}, [numberElement, resultElement])
        );

    </script>
</body>

</html>
