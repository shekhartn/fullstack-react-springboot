<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web page with JS</title>
   <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <div id="root"></div>

    <script>
        // create random number between 1 and 100
        const randomNumber = Math.floor(Math.random() * 100) + 1;
        //create a element to display random number
        const numberElement = document.createElement('h1');
        numberElement.innerHTML= `Random Number: ${randomNumber}`;
    
        //create element to display result 
        const resultElement = document.createElement('h2');
        if (randomNumber % 2 === 0) { 
            resultElement.innerHTML = 'The number is even';
        } else {
            resultElement.innerHTML = 'The number is odd';
        } // Get root element and append the created elements
        const rootElement = document.getElementById('root');
        rootElement.appendChild(numberElement);
        rootElement.appendChild(resultElement);
    
    </script>
</body>
</html>
